<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candela Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="parent">
    <div class="sidebar">
        <div class="sidebar-header"> <h2 class="logo">Candela</h2></div>
        <div class="sidebar-actions"><button class="new-chat-btn">New Chat</button></div>
        <!-- <div class="sidebar-menu">we'll put here something in future</div> -->
        <div class="sidebar-sections"></div>
        <div class="sidebar-footer"><button class="sidebar-settings-btn">Settings</button></div>

    </div>
    <div class="main-content">
        <div id="welcome-zone" class="welcome-zone">
            <p>Welcome home Aditya</p>
        </div>
        <div id="chat-display" class="chat-display">
            <!-- Messages will appear here -->
        </div>
        <div class="input-area">
            <div class="input-box">
                <input type="text" id="user-input" placeholder="write a message...">
                <button id="send-btn">Go</button>
            </div>
            <div class="input-footer">
                <button>+</button>
                <button>gemma4:31b-cloud</button>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
