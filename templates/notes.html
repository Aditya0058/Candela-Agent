<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="digital-clock"></div>

    <div class="container">
        <h1>My Notes</h1>

        <div class="todo-input">
            <input type="text" id="noteInput" placeholder="Enter your note...">
            <button id="addNoteBtn">Add Note</button>
        </div>

        <div id="notesList"></div>

        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('digital-clock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // Load notes on page load
        async function loadNotes() {
            const response = await fetch('/api/notes');
            const notes = await response.json();
            const notesList = document.getElementById('notesList');
            notesList.innerHTML = notes.map(note => `
                <div class="note-item">
                    <p>${escapeHtml(note.content)}</p>
                    <button class="delete-note-btn" data-id="${note.id}">Delete</button>
                </div>
            `).join('');

            // Attach delete handlers
            document.querySelectorAll('.delete-note-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.dataset.id;
                    await fetch(`/api/notes/${id}`, { method: 'DELETE' });
                    loadNotes();
                });
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Add note
        document.getElementById('addNoteBtn').addEventListener('click', async () => {
            const input = document.getElementById('noteInput');
            const content = input.value.trim();
            if (content) {
                await fetch('/api/notes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                input.value = '';
                loadNotes();
            }
        });

        // Allow Enter key to add note
        document.getElementById('noteInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('addNoteBtn').click();
            }
        });

        loadNotes();
    </script>
</body>
</html>
